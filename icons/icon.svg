<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2cbf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Speedometer arc -->
  <path d="M 256 380 A 140 140 0 1 1 396 240"
        fill="none"
        stroke="url(#accent)"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- Speed ticks -->
  <g stroke="#00d4ff" stroke-width="4" opacity="0.6">
    <line x1="140" y1="280" x2="160" y2="270"/>
    <line x1="150" y1="220" x2="175" y2="225"/>
    <line x1="180" y1="170" x2="200" y2="185"/>
    <line x1="230" y1="140" x2="240" y2="160"/>
    <line x1="290" y1="140" x2="280" y2="160"/>
    <line x1="340" y1="170" x2="320" y2="185"/>
    <line x1="370" y1="220" x2="345" y2="225"/>
  </g>

  <!-- Needle -->
  <g transform="rotate(45, 256, 280)">
    <line x1="256" y1="280" x2="256" y2="160"
          stroke="#ff4444"
          stroke-width="8"
          stroke-linecap="round"/>
    <circle cx="256" cy="280" r="20" fill="#ff4444"/>
    <circle cx="256" cy="280" r="10" fill="#1a1a2e"/>
  </g>

  <!-- MPH text -->
  <text x="256" y="350"
        font-family="sans-serif"
        font-size="36"
        font-weight="bold"
        fill="#00d4ff"
        text-anchor="middle">MPH</text>

  <!-- Camera lens hint -->
  <circle cx="256" cy="430" r="25" fill="none" stroke="#7b2cbf" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="430" r="15" fill="#7b2cbf" opacity="0.3"/>
</svg>
